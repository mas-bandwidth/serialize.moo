# serialize.moo CI: the lints, the C oracles, moo-analyze and every test
# directory on the pinned moo, and the vendored corpus checked against its
# pin. Every job runs on the fleet's self-hosted runners, never on a
# GitHub-hosted runner (tools/check-ci.sh refuses one).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on the pinned moo (${{ matrix.moo }})
    # The repository is public and these are the fleet's self-hosted runners
    # (serialize.moo's own set, fleet/runners.tsv in rowan-tools): a pull
    # request from a fork never runs on them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 20
    # release: the pin as embedders ship it; checked: the pin built with
    # -DMOO_OVERFLOW_ERRORS=ON, where arithmetic past 2^47 - 1 raises instead
    # of saturating. The two run in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - moo: release
            suffix: ''
            dist: dist/moo
          - moo: checked
            suffix: '-checked'
            dist: dist/moo-checked
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pin lives once, in the Makefile; the cache key is derived from it.
      - name: Read the moo pin from the Makefile
        id: pin
        run: |
          pin=$(sed -n 's/^MOO_PIN[[:space:]]*:=[[:space:]]*//p' Makefile | head -1)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache ${{ matrix.dist }}
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dist }}
          key: moo${{ matrix.suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}

      # dist-moo refuses a checkout that is not the pin; a cached dist/moo
      # whose PIN file is the pin is used as it is
      - name: Build the pinned moo (${{ matrix.moo }})
        run: |
          if [ "$(cat ${{ matrix.dist }}/PIN 2>/dev/null)" != "${{ steps.pin.outputs.pin }}" ]; then make dist-moo${{ matrix.suffix }} JOBS=4; fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/moorun/go.mod
          cache: false

      # test-checked first runs checked-control: 2^47 must raise number
      # overflow on the checked moo, or the run proves nothing
      - name: Test
        run: make test${{ matrix.suffix }}

  fuzz:
    name: differential fuzz against serialize.go on the pinned moo (${{ matrix.moo }})
    # The repository is public and these are the fleet's self-hosted runners
    # (serialize.moo's own set, fleet/runners.tsv in rowan-tools): a pull
    # request from a fork never runs on them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - moo: release
            suffix: ''
            dist: dist/moo
          - moo: checked
            suffix: '-checked'
            dist: dist/moo-checked
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pin lives once, in the Makefile; the cache key is derived from it.
      - name: Read the moo pin from the Makefile
        id: pin
        run: |
          pin=$(sed -n 's/^MOO_PIN[[:space:]]*:=[[:space:]]*//p' Makefile | head -1)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache ${{ matrix.dist }}
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dist }}
          key: moo${{ matrix.suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}

      - name: Build the pinned moo (${{ matrix.moo }})
        run: |
          if [ "$(cat ${{ matrix.dist }}/PIN 2>/dev/null)" != "${{ steps.pin.outputs.pin }}" ]; then make dist-moo${{ matrix.suffix }} JOBS=4; fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: fuzz/go.mod
          cache: false

      # the smoke: 2000 programs on the fixed seed (the nightly runs an hour on a
      # varying one, nightly-fuzz.yml)
      - name: Differential fuzz (fixed seed)
        run: make fuzz${{ matrix.suffix }}

      # the reversed witness: -widen-int must go red on the writers' bytes
      - name: Negative control (-widen-int must go red)
        if: matrix.moo == 'release'
        run: make fuzz-control

      # the reversed witness for the checked moo: 2^47 must raise
      - name: Negative control (2^47 must raise on the checked moo)
        if: matrix.moo == 'checked'
        run: make checked-control

  corpus:
    name: STANDARD.md and the corpus match the pin
    # The repository is public and these are the fleet's self-hosted runners
    # (serialize.moo's own set, fleet/runners.tsv in rowan-tools): a pull
    # request from a fork never runs on them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet]
    timeout-minutes: 5
    env:
      # A tag or a full commit.
      SERIALIZE_REF: v2.1.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STANDARD.md, IMPLEMENTING.md, conformance/ and conformance-controls/ are VERBATIM copies
      # of the reference at the corpus pin (DESIGN.md, "The vendored
      # standard"); a divergence is red, never a skip.
      - name: Check out the reference at the corpus pin
        run: |
          rm -rf "$RUNNER_TEMP/serialize"
          git init -q "$RUNNER_TEMP/serialize"
          git -C "$RUNNER_TEMP/serialize" fetch -q --depth 1 https://github.com/mas-bandwidth/serialize.git "$SERIALIZE_REF"
          git -C "$RUNNER_TEMP/serialize" -c advice.detachedHead=false checkout -q FETCH_HEAD

      - name: The vendored corpus and standard are the pin's
        run: |
          diff -ru "$RUNNER_TEMP/serialize/conformance" conformance
          diff -ru "$RUNNER_TEMP/serialize/conformance-controls" conformance-controls
          diff -u "$RUNNER_TEMP/serialize/STANDARD.md" STANDARD.md
          diff -u "$RUNNER_TEMP/serialize/IMPLEMENTING.md" IMPLEMENTING.md
